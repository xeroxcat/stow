# i3status configuration file.
# see "man i3status" for documentation.

# It is important that this file is edited as UTF-8.
# The following line should contain a sharp s:
# ß
# If the above line is not correctly displayed, fix your editor first!

general {
  colors = true
  color_good = "#00FFFF"
  color_bad = "#ff005f"
  color_degraded = "#D700FF"
}

# order += "ipv6"
order += "disk /"
order += "disk /var/lib/docker"
order += "disk /home"
# order += "run_watch DHCP"
# order += "run_watch VPN"
#order += "wireless wlp2s0"
order += "ethernet enp3s0"
order += "ethernet enp6s0"
# order += "battery 0"
order += "load"
order += "cpu_usage"
order += "tztime local"

wireless wlp2s0 {
        format_up = "W: (%quality at %essid) %ip"
        format_down = "W: down"
}

ethernet enp6s0 {
        # if you use %speed, i3status requires root privileges
        format_up = "E: %ip (%speed)"
        format_down = "E: down"
}

ethernet enp3s0 {
        # if you use %speed, i3status requires root privileges
        format_up = "E: %ip (%speed)"
        format_down = "E: down"
}

battery 0 {
        format = "%status %percentage %remaining"
}

run_watch DHCP {
        pidfile = "/var/run/dhclient*.pid"
}

run_watch VPN {
        pidfile = "/var/run/vpnc/pid"
}

tztime local {
        format = "%Y-%m-%d %H:%M:%S"
}

load {
        format = "LD:%1min"
}

cpu_usage {
        format = "USG:%cpu0:%cpu1:%cpu2:%cpu3"
}

disk "/" {
        format = "%used root:%percentage_avail free"
        low_threshold = "50" 
#        threshold_bad = "60%" 
}

disk "/var/lib/docker" {
        format = "%used containers:%percentage_avail free"
        low_threshold = "50" 
}

disk "/home" {
        format = "%used home:%percentage_avail free"
        low_threshold = "50" 
#        threshold_bad = "60%" 
}
